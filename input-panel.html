<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ورود به ورودی گزارش</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Tahoma,Arial,sans-serif;
background:#020303;
color:#fff;
overflow:hidden;
}

body:before{
content:"";
position:fixed;
width:500px;
height:500px;
background:rgba(0,110,255,.13);
filter:blur(130px);
border-radius:50%;
top:-180px;
left:-150px;
}

body:after{
content:"";
position:fixed;
width:400px;
height:400px;
background:rgba(0,255,120,.07);
filter:blur(120px);
border-radius:50%;
bottom:-180px;
right:-100px;
}

.box{
width:min(440px,90%);
padding:45px 35px;
border-radius:30px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.09);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);
box-shadow:
0 30px 100px rgba(0,0,0,.7),
0 0 40px rgba(0,100,255,.08);
text-align:center;
position:relative;
z-index:2;
transition:.4s;
}

.box:hover{
border-color:rgba(0,130,255,.65);
box-shadow:
0 30px 100px rgba(0,0,0,.8),
0 0 35px rgba(0,130,255,.25);
}

.icon{
font-size:55px;
margin-bottom:20px;
}

h1{
margin:0 0 10px;
font-size:25px;
}

.desc{
color:#888;
font-size:13px;
margin-bottom:30px;
}

.passwordBox{
position:relative;
}

input{
width:100%;
padding:17px 50px 17px 18px;
border-radius:16px;
border:1px solid rgba(255,255,255,.1);
outline:none;
background:rgba(0,0,0,.35);
color:white;
font-size:18px;
text-align:center;
transition:.3s;
}

input:focus{
border-color:#087dff;
box-shadow:0 0 25px rgba(0,125,255,.18);
}

.eye{
position:absolute;
right:14px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:20px;
opacity:.7;
transition:.2s;
}

.eye:hover{
opacity:1;
}

button{
width:100%;
margin-top:20px;
padding:16px;
border-radius:16px;
border:1px solid rgba(0,255,136,.25);
background:rgba(0,255,136,.07);
color:#00ff88;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.35s;
}

button:hover{
transform:translateY(-4px);
background:rgba(0,255,136,.13);
border-color:#00ff88;
box-shadow:0 0 30px rgba(0,255,136,.2);
}

#error{
height:25px;
margin-top:15px;
color:#ff4d6d;
font-size:13px;
}

.back{
display:inline-block;
margin-top:18px;
color:#777;
text-decoration:none;
font-size:12px;
}

.back:hover{
color:white;
}
</style>
</head>

<body>

<div class="box">

<div class="icon">🔐</div>

<h1>ورودی گزارش</h1>

<div class="desc">
برای ورود رمز عبور را وارد کنید
</div>

<div class="passwordBox">

<input
id="password"
type="password"
placeholder="رمز عبور"
maxlength="20"
>

<span class="eye" id="eye" onclick="togglePassword()">👁</span>

</div>

<button onclick="login()">ورود به پنل ثبت</button>

<div id="error"></div>

<a class="back" href="index.html">← بازگشت به صفحه اصلی</a>

</div>

<script>

function togglePassword(){

const input=document.getElementById("password");
const eye=document.getElementById("eye");

if(input.type==="password"){
input.type="text";
eye.innerText="🙈";
}else{
input.type="password";
eye.innerText="👁";
}

}

function login(){

const password=document.getElementById("password").value;
const error=document.getElementById("error");

if(password==="0000"){
window.location.href="input-panel.html";
}else{
error.innerText="رمز عبور اشتباه است";
}

}

document.getElementById("password").addEventListener("keydown",function(e){
if(e.key==="Enter") login();
});

</script>

</body>
</html>
