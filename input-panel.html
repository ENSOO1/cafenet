<!DOCTYPE html>

<style>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at 15% 10%,rgba(0,125,255,.10),transparent 28%),
radial-gradient(circle at 85% 90%,rgba(0,255,136,.08),transparent 30%),

color:#fff;

/* =========================
   BACKGROUND LIGHTS
========================= */

body:before,
body:after{
content:"";

border-radius:50%;
pointer-events:none;
z-index:0;
}

body:before{
width:550px;
height:550px;
top:-250px;
left:-180px;

animation:floatBlue 9s ease-in-out infinite alternate;
}

body:after{
width:500px;
height:500px;
bottom:-250px;
right:-180px;
background:rgba(0,255,130,.09);
filter:blur(150px);
animation:floatGreen 11s ease-in-out infinite alternate;
}

@keyframes floatBlue{
from{
transform:translate3d(0,0,0);
}
to{
transform:translate3d(80px,60px,0);
}
}

@keyframes floatGreen{
from{
transform:translate3d(0,0,0);
}
to{

}
}

/* =========================
   MOUSE GLOW
========================= */

rgba(0,255,136,.10),
rgba(0,125,255,.04) 35%,
transparent 70%
);

pointer-events:none;
z-index:1;

}

/* =========================
   MAIN
========================= */

.container{

}

/* =========================
   HEADER
========================= */

.header{

}

.title h1{
margin:0;

}

.title p{

}

.back{

border:1px solid rgba(255,255,255,.09);
background:rgba(255,255,255,.045);
border-radius:15px;

backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

transition:.35s;
box-shadow:
inset 0 1px rgba(255,255,255,.06),
0 10px 35px rgba(0,0,0,.25);
}

.back:hover{

0 15px 40px rgba(0,0,0,.45),

}

/* =========================
   STATS
========================= */

.stats{

grid-template-columns:repeat(4,1fr);

}

.stat{
padding:25px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.075),
rgba(255,255,255,.025)
);

border:1px solid rgba(255,255,255,.09);

backdrop-filter:blur(32px);
-webkit-backdrop-filter:blur(32px);

box-shadow:
inset 0 1px rgba(255,255,255,.07),
0 20px 55px rgba(0,0,0,.45);

transition:
transform .45s cubic-bezier(.2,.8,.2,1),
box-shadow .45s,
border-color .45s;

position:relative;
overflow:hidden;
}

.stat:before{
content:"";
position:absolute;
width:130px;
height:130px;
top:-70px;
right:-60px;

background:rgba(0,255,136,.08);

}

.stat:after{
content:"";

}

.stat:hover{
transform:translateY(-9px) scale(1.015);

border-color:rgba(0,255,136,.35);

box-shadow:
inset 0 1px rgba(255,255,255,.09),

}

.stat:hover:after{
transform:scaleX(1);
}

.stat small{
color:#777;
display:block;

}

}

/* =========================
   MAIN PANELS
========================= */

.main{

}

.panel{

linear-gradient(

padding:28px;

backdrop-filter:blur(35px);

box-shadow:
inset 0 1px rgba(255,255,255,.07),
0 25px 75px rgba(0,0,0,.55);

transition:
transform .45s cubic-bezier(.2,.8,.2,1),
border-color .4s,

position:relative;

}

.panel:before{
content:"";
position:absolute;

}

.panel:hover{

border-color:rgba(0,130,255,.38);

box-shadow:
inset 0 1px rgba(255,255,255,.08),
0 30px 80px rgba(0,0,0,.65),

}

.panel h2{
margin-top:0;

z-index:1;
}

/* =========================
   FORM
========================= */

label{
display:block;
font-size:12px;
color:#999;
margin:18px 0 8px;
}

input,
select,
textarea{
width:100%;
padding:14px 15px;

background:
rgba(0,0,0,.38);

border:1px solid rgba(255,255,255,.09);

color:white;
outline:none;

font-family:inherit;

backdrop-filter:blur(15px);

transition:
border-color .3s,
box-shadow .3s,

}

input:hover,

input:focus,

0 0 0 3px rgba(0,125,255,.06),

}

/* =========================
   BUTTONS
========================= */

button{
font-family:inherit;

}

.save{
width:100%;

padding:16px;

border:1px solid rgba(0,255,136,.35);

linear-gradient(

);

backdrop-filter:blur(15px);

transform .35s,

}

.save:hover{

linear-gradient(
135deg,
rgba(0,255,136,.20),

========================= */

.toolbar{

}

.search{

}

.clear{

border:1px solid rgba(255,255,255,.08);

.clear:hover{

/* =========================
   TABLE

.tableWrap{

}

table{

.amountCell{

.action{

translateX(-50%)

/* =========================

========================= */

<body>

<div class="mouseGlow" id="mouseGlow"></div>

<div id="success" class="success">
تراکنش با موفقیت ثبت شد ✓
</div>

<div class="container">

<div class="header">

<div class="title">
<h1>📥 پنل ثبت گزارش</h1>
<p>کافی‌نت جانا • مدیریت تراکنش‌ها</p>
</div>

<a class="back" href="index.html">
← صفحه اصلی
</a>

</div>

<div class="stats">

<div class="stat">
<small>درآمد کل</small>
<strong id="total">0</strong>
</div>

<div class="stat">
<small>درآمد امروز</small>
<strong id="today">0</strong>
</div>

<div class="stat">
<small>تعداد تراکنش</small>
<strong id="count">0</strong>
</div>

<div class="stat">
<small>میانگین تراکنش</small>
<strong id="average">0</strong>
</div>

</div>

<div class="main">

<div class="panel">

<h2 id="formTitle">➕ ثبت تراکنش</h2>

<label>نام مشتری</label>

<input
id="customer"
placeholder="مثلاً علی رضایی"
autocomplete="off"
>

<label>نوع خدمت</label>

<select id="service">

<option value="">انتخاب خدمت</option>

<option>پرینت</option>
<option>کافی‌نت</option>
<option>ثبت‌نام</option>
<option>خدمات اینترنتی</option>
<option>فتوکپی</option>
<option>اسکن</option>
<option>خدمات اداری</option>
<option>سایر</option>

</select>

<label>مبلغ</label>

<input
id="amount"
class="amount"
inputmode="numeric"
autocomplete="off"
placeholder="مثلاً 1,500,000"
>

<label>روش پرداخت</label>

<select id="method">

<option value="کارتخوان">کارتخوان</option>
<option value="نقدی">نقدی</option>
<option value="کارت‌به‌کارت">کارت‌به‌کارت</option>

</select>

<label>توضیحات</label>

<textarea
id="description"
placeholder="توضیحات اختیاری"
></textarea>

<button
class="save"
onclick="saveTransaction()"
id="saveBtn"
>
ثبت تراکنش
</button>

<button
class="cancel"
onclick="cancelEdit()"
id="cancelBtn"
>
لغو ویرایش
</button>

</div>


<div class="panel">

<h2>📋 تراکنش‌ها</h2>

<div class="toolbar">

<input
class="search"
id="search"
placeholder="جستجوی مشتری، خدمت یا روش پرداخت..."
oninput="render()"
>

<button
class="clear"
onclick="clearSearch()"
>
پاک
</button>

</div>

<div class="tableWrap">

<table>

<thead>

<tr>
<th>تاریخ</th>
<th>مشتری</th>
<th>خدمت</th>
<th>مبلغ</th>
<th>پرداخت</th>
<th>عملیات</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let transactions =
JSON.parse(
localStorage.getItem("cafe_transactions") || "[]"
);

let editId = null;


/* =========================
   MOUSE GLOW
========================= */

const mouseGlow =
document.getElementById("mouseGlow");

document.addEventListener("mousemove",(e)=>{

mouseGlow.style.left =
e.clientX + "px";

mouseGlow.style.top =
e.clientY + "px";

});


/* =========================
   AMOUNT FORMAT
========================= */

const amountInput =
document.getElementById("amount");

amountInput.addEventListener(
"input",
function(){

let value =
this.value.replace(/\D/g,"");

if(!value){

this.value="";

return;

}

this.value =
Number(value).toLocaleString("en-US");

});


function rawAmount(){

return Number(
document
.getElementById("amount")
.value
.replace(/,/g,"")
)||0;

}


function money(value){

return Number(value||0)
.toLocaleString("en-US");

}


/* =========================
   SAVE DATA
========================= */

function saveData(){

localStorage.setItem(
"cafe_transactions",
JSON.stringify(transactions)
);

}


/* =========================
   SAVE TRANSACTION
========================= */

function saveTransaction(){

const customer =
document
.getElementById("customer")
.value
.trim();

const service =
document
.getElementById("service")
.value;

const amount =
rawAmount();

const method =
document
.getElementById("method")
.value;

const description =
document
.getElementById("description")
.value
.trim();


if(!customer){

alert("نام مشتری را وارد کنید");

return;

}


if(!service){

alert("نوع خدمت را انتخاب کنید");

return;

}


if(amount<=0){

alert("مبلغ را وارد کنید");

return;

}


/* EDIT */

if(editId!==null){

const item =
transactions.find(
x=>x.id===editId
);

if(item){

item.customer=customer;
item.service=service;
item.amount=amount;
item.method=method;
item.description=description;

}

editId=null;

document
.getElementById("formTitle")
.innerText="➕ ثبت تراکنش";

document
.getElementById("saveBtn")
.innerText="ثبت تراکنش";

document
.getElementById("cancelBtn")
.style.display="none";

}


/* NEW */

else{

transactions.unshift({

id:Date.now(),

customer,

service,

amount,

method,

description,

date:new Date().toISOString()

});

}


saveData();

clearForm();

render();

showSuccess();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

document
.getElementById("customer")
.value="";

document
.getElementById("service")
.value="";

document
.getElementById("amount")
.value="";

document
.getElementById("description")
.value="";

}


/* =========================
   EDIT
========================= */

function editTransaction(id){

const item =
transactions.find(
x=>x.id===id
);

if(!item)return;


document
.getElementById("customer")
.value=item.customer;

document
.getElementById("service")
.value=item.service;

document
.getElementById("amount")
.value=money(item.amount);

document
.getElementById("method")
.value=item.method;

document
.getElementById("description")
.value=item.description||"";


editId=id;


document
.getElementById("formTitle")
.innerText="✏️ ویرایش تراکنش";

document
.getElementById("saveBtn")
.innerText="ذخیره تغییرات";

document
.getElementById("cancelBtn")
.style.display="block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

editId=null;

clearForm();

document
.getElementById("formTitle")
.innerText="➕ ثبت تراکنش";

document
.getElementById("saveBtn")
.innerText="ثبت تراکنش";

document
.getElementById("cancelBtn")
.style.display="none";

}


/* =========================
   DELETE
========================= */

function deleteTransaction(id){

if(!confirm(
"این تراکنش حذف شود؟"
))return;


transactions =
transactions.filter(
x=>x.id!==id
);

saveData();

render();

}


/* =========================
   SEARCH
========================= */

function clearSearch(){

document
.getElementById("search")
.value="";

render();

}


/* =========================
   DATE
========================= */

function formatDate(date){

return new Date(date)
.toLocaleDateString("fa-IR");

}


function formatTime(date){

return new Date(date)
.toLocaleTimeString(
"fa-IR",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =========================
   RENDER
========================= */

function render(){

const body =
document.getElementById(
"tableBody"
);

const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const filtered =
transactions.filter(x=>

String(x.customer)
.toLowerCase()
.includes(search)

||

String(x.service)
.toLowerCase()
.includes(search)

||

String(x.method)
.toLowerCase()
.includes(search)

);


if(filtered.length===0){

body.innerHTML=`

<tr>

<td colspan="6">

<div class="empty">

📭

<br><br>

هنوز تراکنشی ثبت نشده

</div>

</td>

</tr>

`;

}

else{

body.innerHTML=

filtered.map(x=>`

<tr>

<td>

${formatDate(x.date)}

<br>

<small style="color:#555">

${formatTime(x.date)}

</small>

</td>


<td>

${escapeHTML(x.customer)}

</td>


<td>

${escapeHTML(x.service)}

</td>


<td class="amountCell">

${money(x.amount)}

</td>


<td>

<span class="method">

${escapeHTML(x.method)}

</span>

</td>


<td>

<div class="actions">

<button
class="action"
onclick="editTransaction(${x.id})"
title="ویرایش"
>
✏️
</button>

<button
class="action delete"
onclick="deleteTransaction(${x.id})"
title="حذف"
>
🗑
</button>

</div>

</td>

</tr>

`).join("");

}


updateStats();

}


/* =========================
   STATS
========================= */

function updateStats(){

const total =
transactions.reduce(
(sum,x)=>
sum+Number(x.amount),
0
);


const todayStart =
