<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل ثبت - کافی‌نت جانا</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#020303;
color:white;
min-height:100vh;
padding:25px;
}

body:before{
content:"";
position:fixed;
width:500px;
height:500px;
background:rgba(0,120,255,.08);
filter:blur(140px);
border-radius:50%;
top:-200px;
left:-150px;
pointer-events:none;
}

body:after{
content:"";
position:fixed;
width:450px;
height:450px;
background:rgba(0,255,130,.06);
filter:blur(140px);
border-radius:50%;
bottom:-200px;
right:-150px;
pointer-events:none;
}

.container{
max-width:1250px;
margin:auto;
position:relative;
z-index:2;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
margin-bottom:30px;
}

.title h1{
margin:0;
font-size:30px;
}

.title p{
color:#777;
margin:10px 0 0;
font-size:13px;
}

.back{
text-decoration:none;
color:#aaa;
padding:12px 18px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
border-radius:14px;
transition:.3s;
}

.back:hover{
color:white;
border-color:#087dff;
box-shadow:0 0 25px rgba(0,125,255,.2);
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-bottom:25px;
}

.stat{
padding:25px;
border-radius:22px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
transition:.4s;
position:relative;
overflow:hidden;
}

.stat:after{
content:"";
position:absolute;
bottom:0;
right:10%;
left:10%;
height:2px;
background:#00ff88;
box-shadow:0 0 15px #00ff88;
transform:scaleX(0);
transition:.4s;
}

.stat:hover{
transform:translateY(-7px);
border-color:#087dff;
box-shadow:
0 15px 45px rgba(0,0,0,.5),
0 0 25px rgba(0,125,255,.2);
}

.stat:hover:after{
transform:scaleX(1);
}

.stat small{
color:#777;
display:block;
margin-bottom:12px;
}

.stat strong{
font-size:25px;
color:#00ff88;
}

.main{
display:grid;
grid-template-columns:380px 1fr;
gap:22px;
}

.panel{
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
padding:28px;
backdrop-filter:blur(28px);
-webkit-backdrop-filter:blur(28px);
box-shadow:0 25px 70px rgba(0,0,0,.5);
transition:.4s;
}

.panel:hover{
border-color:rgba(0,130,255,.55);
box-shadow:
0 25px 70px rgba(0,0,0,.6),
0 0 30px rgba(0,130,255,.12);
}

.panel h2{
margin-top:0;
font-size:20px;
}

label{
display:block;
font-size:12px;
color:#999;
margin:18px 0 8px;
}

input,select,textarea{
width:100%;
padding:14px;
background:rgba(0,0,0,.35);
border:1px solid rgba(255,255,255,.09);
border-radius:13px;
color:white;
outline:none;
font-family:inherit;
transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
border-color:#087dff;
box-shadow:0 0 22px rgba(0,125,255,.16);
}

select option{
background:#111;
}

textarea{
min-height:80px;
resize:vertical;
}

.amount{
font-size:20px;
font-weight:bold;
letter-spacing:1px;
}

button{
font-family:inherit;
cursor:pointer;
}

.save{
width:100%;
margin-top:22px;
padding:16px;
border-radius:15px;
border:1px solid rgba(0,255,136,.35);
background:rgba(0,255,136,.08);
color:#00ff88;
font-size:16px;
font-weight:bold;
transition:.35s;
}

.save:hover{
transform:translateY(-5px);
border-color:#00ff88;
box-shadow:0 0 30px rgba(0,255,136,.2);
}

.cancel{
width:100%;
margin-top:10px;
padding:12px;
border-radius:15px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.03);
color:#999;
display:none;
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:18px;
}

.search{
flex:1;
}

.clear{
padding:0 18px;
border-radius:13px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
color:#aaa;
}

.tableWrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:700px;
}

th{
color:#777;
font-size:12px;
font-weight:normal;
padding:15px;
border-bottom:1px solid rgba(255,255,255,.08);
}
td{
padding:16px 12px;
border-bottom:1px solid rgba(255,255,255,.05);
font-size:13px;
}

.amountCell{
color:#00ff88;
font-weight:bold;
}

.method{
padding:6px 10px;
border-radius:30px;
background:rgba(0,130,255,.08);
color:#4da3ff;
font-size:11px;
}

.actions{
display:flex;
gap:7px;
}

.action{
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
border-radius:9px;
padding:7px 10px;
color:#aaa;
}

.action:hover{
border-color:#087dff;
color:white;
}

.delete:hover{
border-color:#ff4968;
color:#ff4968;
}

.empty{
text-align:center;
padding:60px 20px;
color:#555;
}

.success{
position:fixed;
left:50%;
top:25px;
transform:translateX(-50%) translateY(-100px);
padding:14px 25px;
border-radius:15px;
background:rgba(0,255,136,.09);
border:1px solid rgba(0,255,136,.35);
color:#00ff88;
backdrop-filter:blur(20px);
transition:.4s;
z-index:20;
}

.success.show{
transform:translateX(-50%) translateY(0);
}

@media(max-width:950px){
.main{
grid-template-columns:1fr;
}
.stats{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:550px){
body{
padding:15px;
}
.header{
align-items:flex-start;
}
.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}
.stat{
padding:18px;
}
.stat strong{
font-size:18px;
}
.panel{
padding:20px;
}
}
</style>
</head>

<body>

<div id="success" class="success">
تراکنش با موفقیت ثبت شد ✓
</div>

<div class="container">

<div class="header">

<div class="title">
<h1>📥 پنل ثبت گزارش</h1>
<p>کافی‌نت جانا • مدیریت تراکنش‌ها</p>
</div>

<a class="back" href="index.html">← صفحه اصلی</a>

</div>

<div class="stats">

<div class="stat">
<small>درآمد کل</small>
<strong id="total">0</strong>
</div>

<div class="stat">
<small>درآمد امروز</small>
<strong id="today">0</strong>
</div>

<div class="stat">
<small>تعداد تراکنش</small>
<strong id="count">0</strong>
</div>

<div class="stat">
<small>میانگین تراکنش</small>
<strong id="average">0</strong>
</div>

</div>

<div class="main">

<div class="panel">

<h2 id="formTitle">➕ ثبت تراکنش</h2>

<label>نام مشتری</label>
<input id="customer" placeholder="مثلاً علی رضایی">

<label>نوع خدمت</label>
<select id="service">
<option value="">انتخاب خدمت</option>
<option>پرینت</option>
<option>کافی‌نت</option>
<option>ثبت‌نام</option>
<option>خدمات اینترنتی</option>
<option>فتوکپی</option>
<option>اسکن</option>
<option>خدمات اداری</option>
<option>سایر</option>
</select>

<label>مبلغ</label>
<input
id="amount"
class="amount"
inputmode="numeric"
placeholder="مثلاً 1,500,000"
>

<label>روش پرداخت</label>
<select id="method">
<option value="کارتخوان">کارتخوان</option>
<option value="نقدی">نقدی</option>
<option value="کارت‌به‌کارت">کارت‌به‌کارت</option>
</select>

<label>توضیحات</label>
<textarea id="description" placeholder="توضیحات اختیاری"></textarea>

<button class="save" onclick="saveTransaction()" id="saveBtn">
ثبت تراکنش
</button>

<button class="cancel" onclick="cancelEdit()" id="cancelBtn">
لغو ویرایش
</button>

</div>

<div class="panel">

<h2>📋 تراکنش‌ها</h2>

<div class="toolbar">

<input
class="search"
id="search"
placeholder="جستجوی مشتری یا خدمت..."
oninput="render()"
>

<button class="clear" onclick="clearSearch()">پاک</button>

</div>

<div class="tableWrap">

<table>

<thead>
<tr>
<th>تاریخ</th>
<th>مشتری</th>
<th>خدمت</th>
<th>مبلغ</th>
<th>پرداخت</th>
<th>عملیات</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>

</div>

<script>

let transactions=
JSON.parse(localStorage.getItem("cafe_transactions")||"[]");

let editId=null;

const amountInput=document.getElementById("amount");

amountInput.addEventListener("input",function(){

let value=this.value.replace(/\D/g,"");

if(!value){
this.value="";
return;
}

this.value=Number(value).toLocaleString("en-US");

});

function rawAmount(){

return Number(
document.getElementById("amount").value.replace(/,/g,"")
)||0;

}

function money(value){

return Number(value||0).toLocaleString("en-US");

}

function saveData(){

localStorage.setItem(
"cafe_transactions",
JSON.stringify(transactions)
);

}

function saveTransaction(){
const customer=document.getElementById("customer").value.trim();
const service=document.getElementById("service").value;
const amount=rawAmount();
const method=document.getElementById("method").value;
const description=document.getElementById("description").value.trim();

if(!customer){
alert("نام مشتری را وارد کنید");
return;
}

if(!service){
alert("نوع خدمت را انتخاب کنید");
return;
}

if(amount<=0){
alert("مبلغ را وارد کنید");
return;
}

if(editId!==null){

const item=transactions.find(x=>x.id===editId);

if(item){

item.customer=customer;
item.service=service;
item.amount=amount;
item.method=method;
item.description=description;

}

editId=null;

document.getElementById("formTitle").innerText="➕ ثبت تراکنش";
document.getElementById("saveBtn").innerText="ثبت تراکنش";
document.getElementById("cancelBtn").style.display="none";

}else{

transactions.unshift({

id:Date.now(),

customer,
service,
amount,
method,
description,

date:new Date().toISOString(),

});

}

saveData();
clearForm();
render();
showSuccess();

}

function clearForm(){

document.getElementById("customer").value="";
document.getElementById("service").value="";
document.getElementById("amount").value="";
document.getElementById("description").value="";

}

function editTransaction(id){

const item=transactions.find(x=>x.id===id);

if(!item)return;

document.getElementById("customer").value=item.customer;
document.getElementById("service").value=item.service;
document.getElementById("amount").value=money(item.amount);
document.getElementById("method").value=item.method;
document.getElementById("description").value=item.description||"";

editId=id;

document.getElementById("formTitle").innerText="✏️ ویرایش تراکنش";
document.getElementById("saveBtn").innerText="ذخیره تغییرات";
document.getElementById("cancelBtn").style.display="block";

window.scrollTo({top:0,behavior:"smooth"});

}

function cancelEdit(){

editId=null;
clearForm();

document.getElementById("formTitle").innerText="➕ ثبت تراکنش";
document.getElementById("saveBtn").innerText="ثبت تراکنش";
document.getElementById("cancelBtn").style.display="none";

}

function deleteTransaction(id){

if(!confirm("این تراکنش حذف شود؟"))return;

transactions=transactions.filter(x=>x.id!==id);

saveData();
render();

}

function clearSearch(){

document.getElementById("search").value="";
render();

}

function formatDate(date){

return new Date(date).toLocaleDateString("fa-IR");

}

function formatTime(date){

return new Date(date).toLocaleTimeString("fa-IR",{
hour:"2-digit",
minute:"2-digit"
});

}

function render(){

const body=document.getElementById("tableBody");

const search=
document.getElementById("search").value.trim().toLowerCase();

const filtered=transactions.filter(x=>
x.customer.toLowerCase().includes(search)||
x.service.toLowerCase().includes(search)||
x.method.toLowerCase().includes(search)
);

if(filtered.length===0){

body.innerHTML=
<tr>
<td colspan="6">
<div class="empty">
📭<br><br>
هنوز تراکنشی ثبت نشده
</div>
</td>
</tr>
;

}else{

body.innerHTML=filtered.map(x=>

<tr>

<td>
${formatDate(x.date)}
<br>
<small style="color:#555">${formatTime(x.date)}</small>
</td>

<td>${escapeHTML(x.customer)}</td>

<td>${escapeHTML(x.service)}</td>

<td class="amountCell">
${money(x.amount)}
</td>

<td>
<span class="method">
${escapeHTML(x.method)}
</span>
</td>

<td>

<div class="actions">

<button
class="action"
onclick="editTransaction(${x.id})">
✏️
</button>

<button
class="action delete"
onclick="deleteTransaction(${x.id})">
🗑
</button>

</div>

</td>

</tr>

).join("");

}

updateStats();

}

function updateStats(){

const total=transactions.reduce(
(sum,x)=>sum+Number(x.amount),0
);

const todayStart=new Date();
todayStart.setHours(0,0,0,0);

const todayTotal=transactions
.filter(x=>new Date(x.date)>=todayStart)
.reduce((sum,x)=>sum+Number(x.amount),0);

const count=transactions.length;

const avg=count?total/count:0;
document.getElementById("total").innerText=money(total);
document.getElementById("today").innerText=money(todayTotal);
document.getElementById("count").innerText=money(count);
document.getElementById("average").innerText=money(Math.round(avg));

}

function showSuccess(){

const box=document.getElementById("success");

box.classList.add("show");

setTimeout(()=>{
box.classList.remove("show");
},1800);

}

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

render();

</script>

</body>
</html>
