<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خروجی گزارش | کافی‌نت جانا</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#020508;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* پس زمینه */
body::before,
body::after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.22;
    pointer-events:none;
}

body::before{
    background:#0077ff;
    top:-180px;
    right:-100px;
}

body::after{
    background:#00aaff;
    bottom:-200px;
    left:-100px;
}

/* نور دنبال کننده موس */
.mouseGlow{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(
        circle,
        rgba(0,140,255,.18) 0%,
        rgba(0,100,255,.08) 35%,
        transparent 70%
    );
    transform:translate(-50%,-50%);
    z-index:1;
}

/* نقطه موس */
.cursorDot{
    position:fixed;
    width:7px;
    height:7px;
    background:#38aaff;
    border-radius:50%;
    box-shadow:
        0 0 8px #008cff,
        0 0 18px #008cff,
        0 0 30px rgba(0,140,255,.8);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* کارت */
.loginBox{
    position:relative;
    z-index:5;
    width:min(420px,90%);
    padding:38px 32px;
    border-radius:25px;

    background:rgba(255,255,255,.055);
    border:1px solid rgba(80,170,255,.22);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 0 35px rgba(0,130,255,.035);

    text-align:center;
    transition:.35s ease;
}

.loginBox:hover{
    transform:translateY(-5px);
    border-color:rgba(40,150,255,.45);
    box-shadow:
        0 30px 90px rgba(0,0,0,.6),
        0 0 35px rgba(0,120,255,.08);
}

/* آیکون */
.icon{
    width:76px;
    height:76px;
    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:rgba(0,120,255,.09);
    border:1px solid rgba(50,160,255,.25);

    font-size:34px;

    box-shadow:
        0 0 25px rgba(0,130,255,.12);
}

/* عنوان */
h1{
    font-size:25px;
    margin-bottom:10px;
    letter-spacing:.3px;
}

.subtitle{
    color:#8fb9df;
    font-size:13px;
    margin-bottom:28px;
}

/* ورودی */
.inputBox{
    position:relative;
    margin-bottom:18px;
}

input{
    width:100%;
    height:56px;
    padding:0 18px 0 52px;

    border-radius:15px;
    border:1px solid rgba(100,180,255,.2);

    outline:none;

    background:rgba(0,0,0,.28);
    color:white;

    font-size:18px;
    text-align:center;

    transition:.3s;
}

input:focus{
    border-color:#168cff;
    box-shadow:
        0 0 0 3px rgba(0,130,255,.08),
        0 0 25px rgba(0,130,255,.1);
}

input::placeholder{
    color:#6f8192;
}

/* چشم */
.eye{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);

    width:27px;
    height:27px;

    cursor:pointer;

    opacity:.7;
    transition:.25s;
}

.eye:hover{
    opacity:1;
    filter:drop-shadow(0 0 6px #008cff);
}

.eye svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:#4faeff;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* دکمه */
.loginBtn{
    width:100%;
    height:56px;

    border:none;
    border-radius:15px;

    background:linear-gradient(
        135deg,
        #006eff,
        #00a2ff
    );

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,110,255,.18);

    transition:.3s;
}

.loginBtn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 15px 40px rgba(0,130,255,.3);
}

.loginBtn:active{
    transform:scale(.98);
}
/* برگشت */
.back{
    display:inline-block;
    margin-top:22px;

    color:#729bc1;
    text-decoration:none;
    font-size:13px;

    transition:.25s;
}

.back:hover{
    color:#38aaff;
    text-shadow:0 0 10px rgba(0,140,255,.5);
}

/* خطا */
.error{
    color:#ff5d5d;
    font-size:13px;
    margin-top:14px;
    min-height:18px;
}

.shake{
    animation:shake .35s ease;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    50%{transform:translateX(8px)}
    75%{transform:translateX(-5px)}
}

/* موبایل */
@media(max-width:500px){
    .loginBox{
        padding:32px 22px;
    }

    h1{
        font-size:22px;
    }
}

/* کاهش حرکت */
@media(prefers-reduced-motion:reduce){
    *{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<div class="mouseGlow" id="mouseGlow"></div>
<div class="cursorDot" id="cursorDot"></div>

<div class="loginBox" id="loginBox">

    <div class="icon">📊</div>

    <h1>ورود به خروجی گزارش</h1>

    <div class="subtitle">
        کافی‌نت جانا • مشاهده گزارش مالی
    </div>

    <div class="inputBox">

        <input
            id="password"
            type="password"
            placeholder="رمز ورود"
            autocomplete="off"
        >

        <div class="eye" id="eye">

            <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>

        </div>

    </div>

    <button class="loginBtn" id="loginBtn">
        ورود به گزارش
    </button>

    <div class="error" id="error"></div>

    <a class="back" href="./index.html">
        ← بازگشت به صفحه اصلی
    </a>

</div>

<script>

/* =========================
   ورود
========================= */

const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const error = document.getElementById("error");
const loginBox = document.getElementById("loginBox");

function login(){

    if(password.value === "1111"){

        error.textContent = "";

        window.location.href = "./output.html";

    }else{

        error.textContent = "رمز ورود اشتباه است";

        loginBox.classList.remove("shake");

        void loginBox.offsetWidth;

        loginBox.classList.add("shake");

        password.value = "";
        password.focus();
    }
}

loginBtn.addEventListener("click", login);

password.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        login();
    }

});


/* =========================
   نمایش / مخفی کردن رمز
========================= */

const eye = document.getElementById("eye");

eye.addEventListener("click", function(){

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

});


/* =========================
   نشانگر موس
========================= */

const mouseGlow = document.getElementById("mouseGlow");
const cursorDot = document.getElementById("cursorDot");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let glowX = mouseX;
let glowY = mouseY;

document.addEventListener("mousemove", function(e){

    mouseX = e.clientX;
    mouseY = e.clientY;

    cursorDot.style.left = mouseX + "px";
    cursorDot.style.top = mouseY + "px";

});


function animateGlow(){

    glowX += (mouseX - glowX) * 0.09;
    glowY += (mouseY - glowY) * 0.09;

    mouseGlow.style.left = glowX + "px";
    mouseGlow.style.top = glowY + "px";

    requestAnimationFrame(animateGlow);
}

animateGlow();


/* =========================
   لمس موبایل
========================= */

document.addEventListener("touchmove", function(e){

    if(e.touches.length){

        const touch = e.touches[0];

        mouseX = touch.clientX;
        mouseY = touch.clientY;

        cursorDot.style.left = mouseX + "px";
        cursorDot.style.top = mouseY + "px";
    }

},{passive:true});

</script>

</body>
</html>
