<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>خروجی گزارش | کافی‌نت جانا</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;

font-family:Tahoma,Arial,sans-serif;

color:white;

background:
radial-gradient(circle at 20% 20%,
rgba(0,255,100,.08),
transparent 30%),

radial-gradient(circle at 80% 80%,
rgba(0,120,255,.16),
transparent 30%),

#020202;

padding:25px;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

h1{
font-size:28px;
}

h1 span{
color:#008cff;

text-shadow:
0 0 15px rgba(0,140,255,.6);
}

.back{
text-decoration:none;
color:white;

padding:12px 20px;

border-radius:13px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(20px);

transition:.3s;
}

.back:hover{
border-color:#008cff;

box-shadow:
0 0 25px rgba(0,140,255,.2);
}

.total{
display:flex;
justify-content:center;
margin-bottom:30px;
}

.circle{
width:240px;
height:240px;

border-radius:50%;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

border:1px solid rgba(0,140,255,.45);

background:
radial-gradient(
circle,
rgba(0,140,255,.16),
rgba(255,255,255,.025)
);

box-shadow:
0 0 30px rgba(0,140,255,.12),
inset 0 0 40px rgba(0,140,255,.06);

animation:float 4s ease-in-out infinite;
}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

.circle small{
color:#888;
margin-bottom:12px;
}

.circle strong{
font-size:27px;
color:#00aaff;

text-shadow:
0 0 15px rgba(0,170,255,.5);
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:25px;
}

.card{
padding:25px;

border-radius:22px;

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(22px);

transition:.35s;
}

.card:hover{
transform:translateY(-8px);

border-color:#008cff;

box-shadow:
0 15px 40px rgba(0,0,0,.5),
0 0 25px rgba(0,140,255,.12);
}

.card h3{
color:#888;
font-size:15px;
}

.card strong{
font-size:23px;
}

.panel{
padding:25px;

border-radius:22px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(22px);
}

.info{
text-align:center;
padding:40px;
color:#777;
}

@media(max-width:750px){

.cards{
grid-template-columns:1fr;
}

.header{
align-items:flex-start;
gap:15px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
خروجی <span>گزارش</span>
</h1>

<a
href="index.html"
class="back"
>
← بازگشت
</a>

</div>


<div class="total">

<div class="circle">

<small>
درآمد کل
</small>

<strong>
۰ تومان
</strong>

</div>

</div>


<div class="cards">

<div class="card">

<h3>💳 کارتخوان</h3>

<strong>
۰ تومان
</strong>

</div>


<div class="card">

<h3>💵 نقدی</h3>

<strong>
۰ تومان
</strong>

</div>


<div class="card">

<h3>📱 کارت به کارت</h3>

<strong>
۰ تومان
</strong>

</div>

</div>


<div class="panel">

<h2>
📊 گزارش تراکنش‌ها
</h2>

<div class="info">

هنوز گزارشی ثبت نشده است.

</div>

</div>

</div>

</body>

</html>
