<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>خروجی گزارش | کافی‌نت جانا</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;

font-family:Tahoma,Arial,sans-serif;

color:white;

background:
radial-gradient(circle at 20% 20%,
rgba(0,255,100,.08),
transparent 30%),

radial-gradient(circle at 80% 80%,
rgba(0,120,255,.10),
transparent 30%),

#030303;

padding:25px;
}

.container{
max-width:1100px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:30px;
}

h1{
font-size:28px;
}

h1 span{
color:#00aaff;
}

.back{
text-decoration:none;
color:white;

padding:12px 20px;

border-radius:13px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(15px);
}

.cards{
display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

margin-bottom:25px;
}

.card{
padding:25px;

border-radius:22px;

background:rgba(255,255,255,.045);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(20px);

transition:.3s;
}

.card:hover{
transform:translateY(-7px);

border-color:#00aaff;
}

.card h3{
color:#888;

font-size:15px;
}

.card strong{
font-size:25px;
}

.total{
display:flex;
justify-content:center;

margin-bottom:25px;
}

.circle{
width:230px;
height:230px;

border-radius:50%;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

border:1px solid rgba(0,170,255,.4);

background:
radial-gradient(
circle,
rgba(0,170,255,.12),
rgba(255,255,255,.02)
);

box-shadow:
0 0 50px rgba(0,170,255,.08);
}

.circle small{
color:#888;
margin-bottom:10px;
}

.circle strong{
font-size:26px;
color:#00aaff;
}

.panel{
padding:25px;

border-radius:22px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(20px);
}

.info{
text-align:center;

padding:40px;

color:#777;
}

@media(max-width:750px){

.cards{
grid-template-columns:1fr;
}

.header{
align-items:flex-start;
gap:15px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
خروجی <span>گزارش</span>
</h1>

<a href="index.html" class="back">
← بازگشت
</a>

</div>


<div class="total">

<div class="circle">

<small>
درآمد کل
</small>

<strong>
۰ تومان
</strong>

</div>

</div>


<div class="cards">

<div class="card">

<h3>
💳 کارتخوان
</h3>

<strong>
۰ تومان
</strong>

</div>


<div class="card">

<h3>
💵 نقدی
</h3>

<strong>
۰ تومان
</strong>

</div>


<div class="card">

<h3>
📱 کارت به کارت
</h3>

<strong>
۰ تومان
</strong>

</div>

</div>


<div class="panel">

<h2>
📊 گزارش تراکنش‌ها
</h2>

<div class="info">

هنوز گزارشی ثبت نشده است.

</div>

</div>

</div>

</body>

</html>
