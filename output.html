<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خروجی گزارش | کافی‌نت جانا</title>

<script src="./data.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 85% 5%,rgba(0,140,255,.08),transparent 30%),
        radial-gradient(circle at 10% 90%,rgba(0,80,255,.07),transparent 30%),
        #020508;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
    padding-bottom:30px;
}

/* =========================
   Background
========================= */

body::before,
body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(130px);
    opacity:.15;
    pointer-events:none;
    z-index:0;
    animation:floatOrb 9s ease-in-out infinite alternate;
}

body::before{
    background:#008cff;
    top:-220px;
    right:-160px;
}

body::after{
    background:#0066ff;
    bottom:-230px;
    left:-160px;
    animation-delay:2s;
}

@keyframes floatOrb{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(35px,25px) scale(1.08);
    }
}

/* =========================
   Mouse Glow
========================= */

.mouseGlow{
    position:fixed;
    width:340px;
    height:340px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(
        circle,
        rgba(0,140,255,.16),
        rgba(0,100,255,.06) 35%,
        transparent 72%
    );
    transform:translate(-50%,-50%);
    z-index:1;
}

.cursorDot{
    position:fixed;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#35aaff;
    box-shadow:
        0 0 8px #008cff,
        0 0 18px #008cff,
        0 0 30px rgba(0,140,255,.8);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* =========================
   Container
========================= */

.container{
    position:relative;
    z-index:5;
    width:min(1250px,94%);
    margin:auto;
    padding:35px 0 60px;
}

/* =========================
   Header
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
}

.title h1{
    font-size:30px;
    margin-bottom:8px;
    text-shadow:0 0 25px rgba(0,140,255,.15);
}

.title p{
    color:#7290aa;
    font-size:13px;
}

.headerActions{
    display:flex;
    gap:10px;
}

.back,
.printBtn{
    text-decoration:none;
    color:#83bfff;
    border:1px solid rgba(0,140,255,.2);
    background:rgba(255,255,255,.04);
    padding:12px 17px;
    border-radius:13px;
    transition:.3s;
    cursor:pointer;
    font-family:inherit;
}

.back:hover,
.printBtn:hover{
    transform:translateY(-3px);
    background:rgba(0,140,255,.1);
    border-color:#168cff;
    box-shadow:0 10px 30px rgba(0,140,255,.08);
}

/* =========================
   Stats
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:22px;
}

.stat{
    position:relative;
    overflow:hidden;
    min-height:130px;
    padding:22px;
    border-radius:23px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 25px 60px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.05);
    transition:.35s;
}

.stat::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:rgba(0,140,255,.08);
    filter:blur(30px);
    top:-50px;
    left:-40px;
}

.stat:hover{
    transform:translateY(-7px);
    border-color:rgba(0,140,255,.4);
    box-shadow:
        0 30px 70px rgba(0,0,0,.45),
        0 0 30px rgba(0,140,255,.08);
}

.stat small{
    color:#70869b;
    font-size:12px;
}

.stat strong{
    display:block;
    margin-top:15px;
    font-size:22px;
    color:#49adff;
    position:relative;
    z-index:2;
}

.statIcon{
    position:absolute;
    left:18px;
    top:17px;
    font-size:25px;
    opacity:.75;
}

/* =========================
   Glass Panels
========================= */

.panel{
    position:relative;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.09);
    border-radius:26px;
    padding:25px;
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.05);
    margin-bottom:22px;
    overflow:hidden;
}

.panel::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        120deg,
        rgba(255,255,255,.035),
        transparent 35%
    );
}

.panelTitle{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.panelTitle h2{
    font-size:19px;
}

.panelTitle span{
    color:#66829c;
    font-size:12px;
}

/* =========================
   Chart
========================= */

.chartWrap{
    position:relative;
    height:280px;
    margin-top:10px;
}

#incomeChart{
    width:100%;
    height:100%;
    display:block;
}

.chartTooltip{
    position:absolute;
    display:none;
    pointer-events:none;
    padding:9px 12px;
    border-radius:10px;
    background:rgba(3,12,20,.9);
    border:1px solid rgba(0,140,255,.3);
    color:#fff;
    font-size:11px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    backdrop-filter:blur(12px);
    z-index:5;
}

/* =========================
   Filters
========================= */

.filterArea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.filters button{
    border:1px solid rgba(0,140,255,.2);
    background:rgba(0,100,255,.05);
    color:#8fcaff;
    padding:10px 16px;
    border-radius:11px;
    cursor:pointer;
    transition:.25s;
    font-family:inherit;
}

.filters button:hover,
.filters button.active{
    background:rgba(0,130,255,.16);
    border-color:#168cff;
    box-shadow:0 0 18px rgba(0,140,255,.08);
}

.searchBox{
    min-width:230px;
}

.searchBox input{
    width:100%;
    border:1px solid rgba(255,255,255,.09);
    outline:none;
    background:rgba(255,255,255,.04);
    color:#fff;
    padding:11px 14px;
    border-radius:12px;
    font-family:inherit;
}

.searchBox input:focus{
    border-color:rgba(0,140,255,.5);
    box-shadow:0 0 20px rgba(0,140,255,.06);
}

/* =========================
   Table
========================= */

.tableWrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th,
td{
    padding:15px 12px;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-align:right;
    font-size:13px;
}

th{
    color:#6f91ae;
    font-weight:normal;
}

td{
    color:#dcecff;
}

tbody tr{
    transition:.25s;
}

tbody tr:hover{
    background:rgba(0,140,255,.035);
}

.amount{
    color:#48adff;
    font-weight:bold;
}

.method{
    display:inline-block;
    padding:5px 9px;
    border-radius:8px;
    background:rgba(0,140,255,.08);
    color:#71bdff;
    font-size:11px;
}

.method.cash{
    color:#6ee7b7;
    background:rgba(16,185,129,.08);
}

.method.card{
    color:#d0a8ff;
    background:rgba(139,92,246,.08);
}

/* =========================
   Empty
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#647789;
}

.emptyIcon{
    font-size:38px;
    margin-bottom:15px;
}

/* =========================
   Notes
========================= */

.noteForm{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:20px;
}

.noteForm textarea{
    width:100%;
    min-height:85px;
    resize:vertical;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.035);
    color:#fff;
    outline:none;
    border-radius:15px;
    padding:13px;
    font-family:inherit;
    line-height:1.8;
}

.noteForm textarea:focus{
    border-color:rgba(0,140,255,.45);
    box-shadow:0 0 20px rgba(0,140,255,.05);
}

.noteAdd{
    align-self:stretch;
    min-width:115px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(
        135deg,
        #007bff,
        #0052cc
    );
    box-shadow:0 10px 30px rgba(0,110,255,.15);
    font-family:inherit;
    transition:.3s;
}

.noteAdd:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(0,110,255,.25);
}

.notes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.note{
    position:relative;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
    min-height:145px;
    transition:.3s;
    overflow:hidden;
}

.note:hover{
    transform:translateY(-5px);
    border-color:rgba(0,140,255,.28);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.note.pinned{
    border-color:rgba(0,140,255,.5);
    box-shadow:
        0 15px 40px rgba(0,0,0,.3),
        0 0 25px rgba(0,140,255,.08);
}

.note.done{
    opacity:.58;
}

.note.done .noteText{
    text-decoration:line-through;
}

.pinBadge{
    position:absolute;
    top:10px;
    left:10px;
    font-size:13px;
}

.noteText{
    color:#c8d9e8;
    line-height:1.9;
    font-size:13px;
    padding-left:15px;
    word-break:break-word;
}

.noteDate{
    margin-top:13px;
    color:#5d7891;
    font-size:10px;
}

.noteActions{
    display:flex;
    gap:6px;
    margin-top:14px;
}

.noteActions button{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    color:#8ca5ba;
    padding:7px 9px;
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    font-size:10px;
    transition:.2s;
}

.noteActions button:hover{
    border-color:rgba(0,140,255,.35);
    color:#fff;
    background:rgba(0,140,255,.08);
}

.noteActions .delete:hover{
    border-color:rgba(255,70,70,.4);
    color:#ff8888;
}

/* =========================
   Toast
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,30px);
    opacity:0;
    pointer-events:none;
    z-index:10000;
    padding:13px 20px;
    border-radius:13px;
    background:rgba(5,15,25,.9);
    border:1px solid rgba(0,140,255,.3);
    color:#dcecff;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
    backdrop-filter:blur(20px);
    transition:.35s;
    font-size:12px;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   Mobile Bottom Navigation
========================= */

.mobileNav{
    display:none;
}

/* =========================
   Responsive
========================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .notes{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    body{
        padding-bottom:105px;
    }

    .container{
        width:92%;
        padding-top:22px;
        padding-bottom:30px;
    }

    .header{
        align-items:flex-start;
        margin-bottom:20px;
    }

    .title h1{
        font-size:22px;
    }

    .title p{
        font-size:11px;
    }

    .headerActions{
        flex-direction:column;
        gap:7px;
    }

    .back,
    .printBtn{
        font-size:10px;
        padding:9px 11px;
        white-space:nowrap;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .stat{
        min-height:105px;
        padding:15px;
        border-radius:18px;
    }

    .stat strong{
        font-size:17px;
        margin-top:13px;
    }

    .stat small{
        font-size:10px;
    }

    .statIcon{
        font-size:20px;
        left:12px;
        top:12px;
    }

    .panel{
        padding:17px;
        border-radius:21px;
        margin-bottom:16px;
    }

    .panelTitle h2{
        font-size:16px;
    }

    .panelTitle span{
        font-size:9px;
    }

    .chartWrap{
        height:220px;
    }

    .filterArea{
        align-items:stretch;
    }

    .filters{
        width:100%;
        overflow-x:auto;
        flex-wrap:nowrap;
        padding-bottom:3px;
    }

    .filters button{
        flex:none;
        font-size:10px;
        padding:9px 13px;
    }

    .searchBox{
        width:100%;
        min-width:0;
    }

    /* Mobile transactions become cards */

    .tableWrap{
        overflow:visible;
    }

    table{
        min-width:0;
        width:100%;
    }

    table thead{
        display:none;
    }

    table,
    tbody,
    tr,
    td{
        display:block;
        width:100%;
    }

    tbody tr{
        position:relative;
        margin-bottom:12px;
        padding:13px;
        border:1px solid rgba(255,255,255,.07);
        border-radius:17px;
        background:rgba(255,255,255,.035);
    }

    tbody tr:hover{
        background:rgba(0,140,255,.04);
    }

    td{
        border:none;
        padding:6px 0;
        font-size:11px;
        display:flex;
        justify-content:space-between;
        gap:10px;
    }

    td::before{
        color:#60788d;
        font-size:9px;
    }

    td:nth-child(1)::before{content:"تاریخ";}
    td:nth-child(2)::before{content:"ساعت";}
    td:nth-child(3)::before{content:"مشتری";}
    td:nth-child(4)::before{content:"خدمت";}
    td:nth-child(5)::before{content:"مبلغ";}
    td:nth-child(6)::before{content:"پرداخت";}
    td:nth-child(7)::before{content:"توضیحات";}

    td:first-child{
        padding-top:0;
    }

    .amount{
        font-size:12px;
    }

    .empty{
        padding:35px 10px;
        font-size:11px;
    }

    .notes{
        grid-template-columns:1fr;
    }

    .noteForm{
        grid-template-columns:1fr;
    }

    .noteAdd{
        min-height:46px;
    }

    .note{
        min-height:135px;
    }

    /* Bottom Nav */

    .mobileNav{
        position:fixed;
        display:flex;
        align-items:center;
        justify-content:space-around;
        gap:5px;
        left:10px;
        right:10px;
        bottom:12px;
        z-index:9000;
        padding:8px 7px;
        border-radius:22px;
        background:rgba(5,12,20,.72);
        border:1px solid rgba(255,255,255,.1);
        backdrop-filter:blur(28px);
        -webkit-backdrop-filter:blur(28px);
        box-shadow:
            0 20px 50px rgba(0,0,0,.55),
            0 0 30px rgba(0,100,255,.06),
            inset 0 1px rgba(255,255,255,.06);
    }

    .mobileNav a{
        flex:1;
        min-width:0;
        text-decoration:none;
        color:#688096;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:4px;
        padding:7px 3px;
        border-radius:15px;
        font-size:8px;
        transition:.25s;
    }

    .mobileNav a span{
        font-size:17px;
        line-height:1;
    }

    .mobileNav a.active{
        color:#64baff;
        background:rgba(0,130,255,.1);
        box-shadow:
            0 0 20px rgba(0,140,255,.08),
            inset 0 0 15px rgba(0,140,255,.04);
    }

    .mobileNav a:active{
        transform:scale(.92);
    }

    .mouseGlow,
    .cursorDot{
        display:none;
    }
}

/* Very small phones */

@media(max-width:360px){

    .container{
        width:94%;
    }

    .title h1{
        font-size:19px;
    }

    .stat strong{
        font-size:15px;
    }

    .mobileNav a{
        font-size:7px;
    }

    .mobileNav a span{
        font-size:15px;
    }
}

/* =========================
   Print
========================= */

@media print{

    body{
        background:#fff;
        color:#000;
    }

    body::before,
    body::after,
    .mouseGlow,
    .cursorDot,
    .headerActions,
    .filters,
    .searchBox,
    .noteForm,
    .noteActions,
    .mobileNav{
        display:none!important;
    }

    .container{
        width:100%;
        padding:0;
    }

    .panel,
    .stat{
        background:#fff;
        color:#000;
        border:1px solid #ddd;
        box-shadow:none;
        backdrop-filter:none;
    }

    .title h1,
    .panelTitle h2,
    td{
        color:#000;
    }

    .title p,
    th,
    .panelTitle span,
    .stat small{
        color:#555;
    }

    .stat strong,
    .amount{
        color:#0066aa;
    }
}
</style>
</head>

<body>

<div class="mouseGlow" id="mouseGlow"></div>
<div class="cursorDot" id="cursorDot"></div>

<div class="container" id="home">

    <!-- Header -->
    <header class="header">

        <div class="title">
            <h1>📊 خروجی گزارش</h1>
            <p>کافی‌نت جانا • گزارش مالی</p>
        </div>

        <div class="headerActions">

            <button class="printBtn" onclick="window.print()">
                🖨 چاپ گزارش
            </button>

            <a href="./index.html" class="back">
                ← صفحه اصلی
            </a>

        </div>

    </header>


    <!-- Stats -->
    <section class="stats" id="income">

        <div class="stat">
            <span class="statIcon">💰</span>
            <small>کل درآمد</small>
            <strong id="totalIncome">۰ تومان</strong>
        </div>

        <div class="stat">
            <span class="statIcon">🧾</span>
            <small>تعداد تراکنش</small>
            <strong id="transactionCount">۰</strong>
        </div>

        <div class="stat">
            <span class="statIcon">💳</span>
            <small>کارتخوان</small>
            <strong id="posTotal">۰</strong>
        </div>

        <div class="stat">
            <span class="statIcon">💵</span>
            <small>نقدی</small>
            <strong id="cashTotal">۰</strong>
        </div>

    </section>


    <!-- Chart -->
    <section class="panel">

        <div class="panelTitle">

            <h2>📈 نمودار درآمد</h2>

            <span id="chartInfo">
                درآمد روزانه
            </span>

        </div>

        <div class="chartWrap">

            <svg
                id="incomeChart"
                viewBox="0 0 1000 280"
                preserveAspectRatio="none">
            </svg>

            <div
                class="chartTooltip"
                id="chartTooltip">
            </div>

        </div>

    </section>


    <!-- Transactions -->
    <section class="panel" id="transactions">

        <div class="panelTitle">

            <h2>🧾 تراکنش‌ها</h2>

            <span id="reportDate">
                گزارش مالی
            </span>

        </div>

        <div class="filterArea">

            <div class="filters">

                <button
                    class="active"
                    onclick="filterData('all',this)">
                    همه
                </button>

                <button
                    onclick="filterData('کارتخوان',this)">
                    کارتخوان
                </button>

                <button
                    onclick="filterData('نقدی',this)">
                    نقدی
                </button>

                <button
                    onclick="filterData('کارت به کارت',this)">
                    کارت به کارت
                </button>

            </div>

            <div class="searchBox">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="🔎 جستجوی مشتری، خدمت..."
                    oninput="renderTransactions()">

            </div>

        </div>


        <div class="tableWrap">

            <table>

                <thead>

                    <tr>
                        <th>تاریخ</th>
                        <th>ساعت</th>
                        <th>مشتری</th>
                        <th>خدمت</th>
                        <th>مبلغ</th>
                        <th>روش پرداخت</th>
                        <th>توضیحات</th>
                    </tr>

                </thead>

                <tbody id="transactionsBody"></tbody>

            </table>

        </div>

    </section>


    <!-- Notes -->

<script>

/* =====================================================
   DATA
===================================================== */

let allTransactions = [];

let currentFilter = "all";

let localNotes = [];


/* =====================================================
   LOAD DATA.JS
===================================================== */

if(typeof cafeData !== "undefined"){

    allTransactions =
        Array.isArray(cafeData.transactions)
        ? cafeData.transactions
        : [];

}else{

    console.warn("data.js پیدا نشد.");

}


/* =====================================================
   NUMBER
===================================================== */

function faNumber(number){

    return Number(number || 0)
        .toLocaleString("fa-IR");

}


/* =====================================================
   MONEY
===================================================== */

function money(number){

    return faNumber(number) + " تومان";

}


/* =====================================================
   SAFE TEXT
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const transactions =
        currentFilter === "all"
        ? allTransactions
        : allTransactions.filter(
            item =>
                item.method === currentFilter
        );


    let total = 0;
    let pos = 0;
    let cash = 0;


    transactions.forEach(item => {

        const amount =
            Number(item.amount || 0);

        total += amount;


        if(item.method === "کارتخوان"){
            pos += amount;
        }


        if(item.method === "نقدی"){
            cash += amount;
        }

    });


    document.getElementById("totalIncome")
        .textContent = money(total);


    document.getElementById("transactionCount")
        .textContent =
        faNumber(transactions.length);


    document.getElementById("posTotal")
        .textContent = money(pos);


    document.getElementById("cashTotal")
        .textContent = money(cash);

}


/* =====================================================
   TRANSACTIONS
===================================================== */

function getFilteredTransactions(){

    let transactions =
        currentFilter === "all"
        ? [...allTransactions]
        : allTransactions.filter(
            item =>
                item.method === currentFilter
        );


    const search =
        document.getElementById("searchInput")
        ?.value
        .trim()
        .toLowerCase();


    if(search){

        transactions =
            transactions.filter(item => {

                const text = [
                    item.date,
                    item.time,
                    item.customer,
                    item.service,
                    item.method,
                    item.description
                ]
                .join(" ")
                .toLowerCase();

                return text.includes(search);

            });

    }


    return transactions;

}


function renderTransactions(){

    const body =
        document.getElementById(
            "transactionsBody"
        );


    body.innerHTML = "";


    const transactions =
        getFilteredTransactions();


    if(!transactions.length){

        body.innerHTML = `
            <tr>
                <td colspan="7">

                    <div class="empty">

                        <div class="emptyIcon">
                            📭
                        </div>

                        هنوز تراکنشی برای نمایش وجود ندارد.

                    </div>

                </td>
            </tr>
        `;

        return;

    }


    transactions.forEach(item => {

        const row =
            document.createElement("tr");


        let methodClass = "";

        if(item.method === "نقدی"){
            methodClass = "cash";
        }

        if(item.method === "کارت به کارت"){
            methodClass = "card";
        }


        row.innerHTML = `

            <td>
                ${escapeHTML(item.date || "-")}
            </td>

            <td>
                ${escapeHTML(item.time || "-")}
            </td>

            <td>
                ${escapeHTML(item.customer || "-")}
            </td>

            <td>
                ${escapeHTML(item.service || "-")}
            </td>

            <td class="amount">
                ${money(item.amount)}
            </td>

            <td>
                <span class="method ${methodClass}">
                    ${escapeHTML(item.method || "-")}
                </span>
            </td>

            <td>
                ${escapeHTML(item.description || "-")}
            </td>

        `;


        body.appendChild(row);

    });

}


/* =====================================================
   FILTER
===================================================== */

function filterData(filter,button){

    currentFilter = filter;


    document.querySelectorAll(
        ".filters button"
    ).forEach(btn => {

        btn.classList.remove("active");

    });


    button.classList.add("active");


    updateStats();

    renderTransactions();

}


/* =====================================================
   NOTES STORAGE
===================================================== */

function loadNotes(){

    try{

        const saved =
            localStorage.getItem(
                "cafe_notes"
            );


        localNotes =
            saved
            ? JSON.parse(saved)
            : [];


        if(!Array.isArray(localNotes)){
            localNotes = [];
        }

    }catch(error){

        localNotes = [];

    }


    /*
       اگر data.js یادداشت داشته باشد
       و قبلاً در localStorage ذخیره نشده باشد،
       آنها را هم نمایش می‌دهیم.
    */

    if(
        typeof cafeData !== "undefined" &&
        Array.isArray(cafeData.notes)
    ){

        const staticNotes =
            cafeData.notes.map(
                (note,index) => ({
                    id:
                        "data_" + index,
                    text:
                        note.text || "",
                    date:
                        note.date || "",
                    pinned:false,
                    done:false
                })
            );


        staticNotes.forEach(note => {

            const exists =
                localNotes.some(
                    item =>
                        item.text === note.text
                );


            if(!exists){
                localNotes.push(note);
            }

        });

    }


    saveNotes();

}


function saveNotes(){

    localStorage.setItem(
        "cafe_notes",
        JSON.stringify(localNotes)
    );

}


/* =====================================================
   ADD NOTE
===================================================== */

function addNote(){

    const input =
        document.getElementById(
            "noteInput"
        );


    const text =
        input.value.trim();


    if(!text){

        showToast(
            "⚠️ اول متن یادداشت را بنویس."
        );

        input.focus();

        return;

    }


    const now =
        new Date();


    const note = {

        id:
            Date.now(),

        text:
            text,

        date:
            now.toLocaleDateString(
                "fa-IR"
            ) +
            " • " +
            now.toLocaleTimeString(
                "fa-IR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ),

        pinned:false,

        done:false

    };


    localNotes.unshift(note);

    saveNotes();

    input.value = "";

    renderNotes();

    showToast(
        "✅ یادداشت ثبت شد."
    );

}


/* =====================================================
   NOTE ACTIONS
===================================================== */

function togglePin(id){

    localNotes =
        localNotes.map(note => {

            if(note.id === id){

                return {
                    ...note,
                    pinned:!note.pinned
                };

            }

            return note;

        });


    saveNotes();

    renderNotes();

    showToast(
        "📌 وضعیت پین تغییر کرد."
    );

}


function toggleDone(id){

    localNotes =
        localNotes.map(note => {

            if(note.id === id){

                return {
                    ...note,
                    done:!note.done
                };

            }

            return note;

        });


    saveNotes();

    renderNotes();

}


function deleteNote(id){

    if(
        !confirm(
            "این یادداشت حذف شود؟"
        )
    ){
        return;
    }


    localNotes =
        localNotes.filter(
            note =>
                note.id !== id
        );


    saveNotes();

    renderNotes();

    showToast(
        "🗑 یادداشت حذف شد."
    );

}


/* =====================================================
   NOTES RENDER
===================================================== */

function renderNotes(){

    const container =
        document.getElementById(
            "notesContainer"
        );


    container.innerHTML = "";


    const notes =
        [...localNotes].sort(
            (a,b) =>
                Number(b.pinned) -
                Number(a.pinned)
        );


    if(!notes.length){

        container.innerHTML = `

            <div
                class="empty"
                style="grid-column:1/-1">

                <div class="emptyIcon">
                    📝
                </div>

                هنوز یادداشتی ثبت نشده است.

            </div>

        `;

        return;

    }


    notes.forEach(note => {

        const div =
            document.createElement("div");


        div.className =
            "note" +
            (note.pinned
                ? " pinned"
                : "") +
            (note.done
                ? " done"
                : "");


        div.innerHTML = `

            ${
                note.pinned
                ? '<div class="pinBadge">📌</div>'
                : ""
            }

            <div class="noteText">
                ${escapeHTML(note.text)}
            </div>

            <div class="noteDate">
                ${escapeHTML(note.date || "")}
            </div>

            <div class="noteActions">

                <button
                    onclick="toggleDone(${JSON.stringify(note.id)})">

                    ${note.done ? "↩ باز کردن" : "✓ انجام شد"}

                </button>

                <button
                    onclick="togglePin(${JSON.stringify(note.id)})">

                    ${note.pinned ? "📌 برداشتن پین" : "📌 پین"}

                </button>

                <button
                    class="delete"
                    onclick="deleteNote(${JSON.stringify(note.id)})">

                    🗑 حذف

                </button>

            </div>

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   INCOME CHART
===================================================== */

function drawChart(){

    const svg =
        document.getElementById(
            "incomeChart"
        );


    svg.innerHTML = "";


    const width = 1000;
    const height = 280;

    const paddingX = 45;
    const paddingTop = 25;
    const paddingBottom = 35;


    /*
       جمع درآمد بر اساس تاریخ
    */

    const grouped = {};


    allTransactions.forEach(item => {

        const date =
            item.date || "بدون تاریخ";

        if(!grouped[date]){
            grouped[date] = 0;
        }

        grouped[date] +=
            Number(item.amount || 0);

    });


    let labels =
        Object.keys(grouped);


    /*
       فقط 10 روز آخر
    */

    labels =
        labels.slice(-10);


    if(!labels.length){

        svg.innerHTML = `
            <text
                x="500"
                y="145"
                text-anchor="middle"
                fill="#5d7488"
                font-size="14">
                هنوز اطلاعاتی برای رسم نمودار وجود ندارد
            </text>
        `;

        return;

    }


    const values =
        labels.map(
            label =>
                grouped[label]
        );


    const maxValue =
        Math.max(
            ...values,
            1
        );


    const chartWidth =
        width -
        paddingX * 2;


    const chartHeight =
        height -
        paddingTop -
        paddingBottom;


    const step =
        labels.length === 1
        ? chartWidth
        : chartWidth /
            (labels.length - 1);


    /*
       خطوط افقی
    */

    for(let i=0;i<4;i++){

        const y =
            paddingTop +
            (chartHeight / 3) * i;


        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        line.setAttribute(
            "x1",
            paddingX
        );

        line.setAttribute(
            "x2",
            width - paddingX
        );

        line.setAttribute(
            "y1",
            y
        );

        line.setAttribute(
            "y2",
            y
        );

        line.setAttribute(
            "stroke",
            "rgba(255,255,255,.07)"
        );

        line.setAttribute(
            "stroke-width",
            "1"
        );


        svg.appendChild(line);

    }


    /*
       نقاط
    */

    const points =
        values.map(
            (value,index) => {

                const x =
                    labels.length === 1
                    ? width / 2
                    : paddingX +
                        index * step;


                const y =
                    paddingTop +
                    chartHeight -
                    (value / maxValue) *
                    chartHeight;


                return {
                    x,
                    y,
                    value,
                    label:labels[index]
                };

            }
        );


    /*
       Area
    */

    let areaPath =
        `M ${points[0].x} ${height-paddingBottom}`;

    points.forEach(point => {

        areaPath +=
            ` L ${point.x} ${point.y}`;

    });


    areaPath +=
        ` L ${points[points.length-1].x} ${height-paddingBottom} Z`;


    const area =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    area.setAttribute(
        "d",
        areaPath
    );

    area.setAttribute(
        "fill",
        "rgba(0,140,255,.10)"
    );

    area.setAttribute(
        "stroke",
        "none"
    );


    svg.appendChild(area);


    /*
       Line
    */

    let linePath =
        `M ${points[0].x} ${points[0].y}`;


    for(let i=1;i<points.length;i++){

        linePath +=
            ` L ${points[i].x} ${points[i].y}`;

    }


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    line.setAttribute(
        "d",
        linePath
    );

    line.setAttribute(
        "fill",
        "none"
    );

    line.setAttribute(
        "stroke",
        "#168cff"
    );

    line.setAttribute(
        "stroke-width",
        "4"
    );

    line.setAttribute(
        "stroke-linecap",
        "round"
    );

    line.setAttribute(
        "stroke-linejoin",
        "round"
    );


    svg.appendChild(line);


    /*
       نقاط روی نمودار
    */

    points.forEach(point => {

        const circle =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );


        circle.setAttribute(
            "cx",
            point.x
        );

        circle.setAttribute(
            "cy",
            point.y
        );

        circle.setAttribute(
            "r",
            "6"
        );

        circle.setAttribute(
            "fill",
            "#07121c"
        );

        circle.setAttribute(
            "stroke",
            "#35aaff"
        );

        circle.setAttribute(
            "stroke-width",
            "3"
        );


        svg.appendChild(circle);


        /*
           تاریخ
        */

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        text.setAttribute(
            "x",
            point.x
        );

        text.setAttribute(
            "y",
            height - 10
        );

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "fill",
            "#526d83"
        );

        text.setAttribute(
            "font-size",
            "11"
        );

        text.textContent =
            point.label;


        svg.appendChild(text);

    });

}

function showDate(){

    const today =
        new Date();


    document.getElementById(
        "reportDate"

        "آخرین بروزرسانی: " +

/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2200
        );

}


/* =====================================================
   MOBILE NAV
===================================================== */

function setNav(element){

    document.querySelectorAll(
        ".mobileNav a"
    ).forEach(item => {

        item.classList.remove(
            "active"
        );

    });


    element.classList.add(
        "active"
    );

}


/* =====================================================
   SCROLL NAV
===================================================== */

if("IntersectionObserver" in window){

    const sections =
        document.querySelectorAll(
            "#home,#income,#transactions,#notes"
        );


    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if(entry.isIntersecting){

                        const id =
                            entry.target.id;


                        document
                            .querySelectorAll(
                                ".mobileNav a"
                            )
                            .forEach(link => {

                                link.classList.remove(
                                    "active"
                                );


                                if(
                                    link.getAttribute(
                                        "href"
                                    ) === "#" + id
                                ){

                                    link.classList.add(
                                        "active"
                                    );

                                }

                            });

                    }

                });

            },
            {
                threshold:.35
            }
        );


    sections.forEach(
        section =>
            observer.observe(section)
    );

}


/* =====================================================
   ENTER TO ADD NOTE
===================================================== */

document
    .getElementById("noteInput")
    .addEventListener(
        "keydown",
        function(e){

            if(
                e.key === "Enter" &&
                (e.ctrlKey || e.metaKey)
            ){

                e.preventDefault();

                addNote();

            }

        }
    );


/* =====================================================
   MOUSE
===================================================== */

const mouseGlow =
    document.getElementById(
        "mouseGlow"
    );

const cursorDot =
    document.getElementById(
        "cursorDot"
    );


let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;

let glowX =
    mouseX;

let glowY =
    mouseY;


document.addEventListener(
    "mousemove",
    function(e){

        mouseX =
            e.clientX;

        mouseY =
            e.clientY;


        cursorDot.style.left =
            mouseX + "px";

        cursorDot.style.top =
            mouseY + "px";

    }
);


function animateGlow(){

    glowX +=
        (mouseX - glowX) * .08;

    glowY +=
        (mouseY - glowY) * .08;


    mouseGlow.style.left =
        glowX + "px";

    mouseGlow.style.top =
        glowY + "px";


    requestAnimationFrame(
        animateGlow
    );

}


animateGlow();


/* =====================================================
   START
===================================================== */

loadNotes();

updateStats();

renderTransactions();

renderNotes();

drawChart();

showDate();

</script>
