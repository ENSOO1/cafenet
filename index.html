<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>کافی‌نت جانا</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
font-family:Tahoma,Arial,sans-serif;
background:#020303;
color:white;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
position:relative;
}

body:before{
content:"";
position:fixed;
width:500px;
height:500px;
background:rgba(0,120,255,.10);
filter:blur(120px);
border-radius:50%;
top:-180px;
left:-150px;
pointer-events:none;
}

body:after{
content:"";
position:fixed;
width:450px;
height:450px;
background:rgba(0,255,100,.06);
filter:blur(130px);
border-radius:50%;
bottom:-200px;
right:-120px;
pointer-events:none;
}

.container{
width:min(1100px,92%);
text-align:center;
position:relative;
z-index:2;
}

.logo{
font-size:clamp(30px,6vw,58px);
font-weight:900;
letter-spacing:2px;
margin-bottom:12px;
text-shadow:0 0 25px rgba(255,255,255,.15);
}

.logo span{
color:#00ff88;
text-shadow:0 0 20px rgba(0,255,136,.6);
}

.subtitle{
color:#aaa;
margin-bottom:55px;
font-size:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:28px;
}

.card{
position:relative;
min-height:300px;
padding:45px 30px;
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
background:rgba(255,255,255,.045);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
box-shadow:
0 25px 70px rgba(0,0,0,.55),
inset 0 1px rgba(255,255,255,.08);
text-decoration:none;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:hidden;
transition:.45s cubic-bezier(.2,.8,.2,1);
}

.card:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
120deg,
transparent,
rgba(0,130,255,.10),
transparent
);
transform:translateX(-100%);
transition:.6s;
}

.card:after{
content:"";
position:absolute;
bottom:0;
right:12%;
left:12%;
height:2px;
background:#00ff88;
box-shadow:0 0 20px #00ff88;
transform:scaleX(0);
transition:.4s;
}

.card:hover{
transform:translateY(-14px) scale(1.025);
border-color:#168cff;
box-shadow:
0 30px 90px rgba(0,0,0,.7),
0 0 30px rgba(0,130,255,.35),
inset 0 1px rgba(255,255,255,.15);
}

.card:hover:before{
transform:translateX(100%);
}

.card:hover:after{
transform:scaleX(1);
}

.icon{
font-size:65px;
margin-bottom:25px;
filter:drop-shadow(0 0 15px rgba(0,150,255,.3));
}

.card h2{
margin:0 0 12px;
font-size:25px;
}

.card p{
margin:0;
color:#aaa;
line-height:2;
font-size:14px;
}

.badge{
margin-top:25px;
padding:9px 18px;
border-radius:50px;
background:rgba(0,255,136,.08);
border:1px solid rgba(0,255,136,.2);
color:#00ff88;
font-size:12px;
}

.footer{
margin-top:45px;
color:#555;
font-size:12px;
}

@media(max-width:700px){
.cards{
grid-template-columns:1fr;
}
.card{
min-height:230px;
}
.subtitle{
margin-bottom:30px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
کافی‌نت <span>جانـــــــا</span>
</div>

<div class="subtitle">
سامانه مدیریت و گزارش مالی
</div>

<div class="cards">

<a class="card" href="input.html">
<div class="icon">📥</div>
<h2>ورودی گزارش</h2>
<p>ثبت و مدیریت تراکنش‌ها، درآمدها و اطلاعات مالی</p>
<div class="badge">ورود به بخش ثبت</div>
</a>

<a class="card" href="output.html">
<div class="icon">📊</div>
<h2>خروجی گزارش</h2>
<p>مشاهده درآمد، آمار، نمودار و گزارش تراکنش‌ها</p>
<div class="badge">مشاهده گزارش</div>
</a>

</div>

<div class="footer">
JANA CYBER CAFE • MANAGEMENT SYSTEM
</div>

</div>

</body>
</html>
