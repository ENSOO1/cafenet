<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کافی‌نت جانـــــــا</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0,255,140,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(0,120,255,.07),
            transparent 30%
        ),
        #020505;

    color:#fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

}


/* =========================================
   پس زمینه
========================================= */

.bgOrb{

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    filter:blur(110px);

    opacity:.15;

    pointer-events:none;

    z-index:0;

}

.orbGreen{

    background:#00ff88;

    top:-220px;
    right:-150px;

}

.orbBlue{

    background:#008cff;

    bottom:-220px;
    left:-150px;

}


/* =========================================
   نور دنبال کننده موس
========================================= */

.mouseGlow{

    position:fixed;

    width:320px;
    height:320px;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(0,255,150,.14) 0%,
            rgba(0,170,255,.08) 35%,
            transparent 72%
        );

    transform:translate(-50%,-50%);

    z-index:1;

}


/* =========================================
   نقطه موس
========================================= */

.cursorDot{

    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#31ff9b;

    box-shadow:

        0 0 7px #00ff88,
        0 0 16px #00ff88,
        0 0 30px rgba(0,255,140,.8);

    pointer-events:none;

    transform:translate(-50%,-50%);

    z-index:9999;

}


/* =========================================
   کانتینر اصلی
========================================= */

.main{

    position:relative;

    z-index:5;

    width:min(900px,92%);

    text-align:center;

}


/* =========================================
   عنوان
========================================= */

.logo{

    margin-bottom:55px;

}

.logo h1{

    font-size:clamp(28px,6vw,52px);

    font-weight:bold;

    letter-spacing:1px;

    text-shadow:

        0 0 10px rgba(0,255,140,.15),
        0 0 30px rgba(0,255,140,.08);

}

.logo h1 span{

    color:#20ff91;

}

.logo p{

    margin-top:12px;

    color:#81958d;

    font-size:14px;

}


/* =========================================
   کارت ها
========================================= */

.cards{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:28px;

}


/* =========================================
   کارت اصلی
========================================= */

.card{

    position:relative;

    min-height:260px;

    border-radius:30px;

    padding:35px;

    text-decoration:none;

    color:#fff;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:

        0 25px 70px rgba(0,0,0,.45),

        inset 0 0 30px
        rgba(255,255,255,.015);

    transition:

        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

}


/* =========================================
   نور داخل کارت
========================================= */

.card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    filter:blur(70px);

    opacity:.15;

    transition:.4s;

}


/* =========================================
   خط نور پایین کارت
========================================= */

.card::after{

    content:"";

    position:absolute;

    left:15%;
    right:15%;

    bottom:0;

    height:2px;

    border-radius:100%;

    opacity:.5;

    transition:.35s;

}


/* =========================================
   کارت ورودی
========================================= */

.inputCard::before{

    background:#00ff88;

    top:-80px;
    right:-70px;

}

.inputCard::after{

    background:#00ff88;

    box-shadow:

        0 0 12px #00ff88,
        0 0 30px rgba(0,255,136,.6);

}


/* =========================================
   کارت خروجی
========================================= */

.outputCard::before{

    background:#008cff;

    bottom:-80px;
    left:-70px;

}

.outputCard::after{

    background:#168cff;

    box-shadow:

        0 0 12px #168cff,
        0 0 30px rgba(0,140,255,.6);

}


/* =========================================
   Hover
========================================= */

.card:hover{

    transform:
        translateY(-10px)
        scale(1.015);

}

.inputCard:hover{

    border-color:
        rgba(0,255,136,.4);

    box-shadow:

        0 35px 90px rgba(0,0,0,.55),

        0 0 35px rgba(0,255,136,.08);

}

.outputCard:hover{

    border-color:
        rgba(0,140,255,.4);

    box-shadow:

        0 35px 90px rgba(0,0,0,.55),

        0 0 35px rgba(0,140,255,.08);

}

.card:hover::before{

    opacity:.25;

}

.card:hover::after{

    left:8%;
    right:8%;

    opacity:1;

}


/* =========================================
   آیکون
========================================= */

.icon{

    width:85px;
    height:85px;

    border-radius:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:38px;

    margin-bottom:22px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(10px);

    transition:.35s;

}


.inputCard:hover .icon{

    transform:
        translateY(-4px)
        rotate(-2deg);

    box-shadow:
        0 0 30px rgba(0,255,136,.15);

}

.outputCard:hover .icon{

    transform:
        translateY(-4px)
        rotate(2deg);

    box-shadow:
        0 0 30px rgba(0,140,255,.15);

}


/* =========================================
   عنوان کارت
========================================= */

.card h2{

    font-size:25px;

    margin-bottom:10px;

}

.inputCard h2{

    color:#39ff9d;

}

.outputCard h2{

    color:#46aaff;

}


/* =========================================
   توضیح کارت
========================================= */

.card p{

    color:#84918d;

    font-size:13px;

    line-height:1.8;

}


/* =========================================
   فلش
========================================= */

.arrow{

    margin-top:18px;

    font-size:22px;

    opacity:.55;

    transition:.3s;

}

.card:hover .arrow{

    opacity:1;

    transform:
        translateX(-6px);

}


/* =========================================
   پایین صفحه
========================================= */

.footer{

    margin-top:45px;

    color:#4e5b57;

    font-size:11px;

}

.footer span{

    color:#1c9e66;

}


/* =========================================
   موبایل
========================================= */

@media(max-width:650px){

    body{

        overflow:auto;

    }

    .main{

        padding:
            45px 0;

    }

    .logo{

        margin-bottom:35px;

    }

    .cards{

        grid-template-columns:1fr;

        gap:18px;

    }

    .card{

        min-height:220px;

        padding:28px;

    }

    .icon{

        width:70px;
        height:70px;

        font-size:30px;

        margin-bottom:17px;

    }

    .card h2{

        font-size:22px;

    }

}


/* =========================================
   کاهش حرکت
========================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none!important;
        transition:none!important;

    }

}

</style>

</head>


<body>


<!-- پس زمینه -->

<div class="bgOrb orbGreen"></div>
<div class="bgOrb orbBlue"></div>


<!-- نور موس -->

<div
    class="mouseGlow"
    id="mouseGlow">
</div>


<!-- نقطه موس -->

<div
    class="cursorDot"
    id="cursorDot">
</div>


<main class="main">


    <!-- عنوان -->

    <div class="logo">

        <h1>

            کافی‌نت
            <span>جانـــــــا</span>

        </h1>

        <p>

            سامانه مدیریت و گزارش کافی‌نت

        </p>

    </div>


    <!-- فقط دو کارت -->

    <div class="cards">


        <!-- ورودی گزارش -->

        <a
            href="./input.html"
            class="card inputCard"
        >

            <div class="icon">
                📝
            </div>

            <h2>
                ورودی گزارش
            </h2>

            <p>
                ثبت و مدیریت اطلاعات،
                تراکنش‌ها و گزارش‌های روزانه
            </p>

            <div class="arrow">
                ←
            </div>

        </a>


        <!-- خروجی گزارش -->

        <a
            href="./output-login.html"
            class="card outputCard"
        >

            <div class="icon">
                📊
            </div>

            <h2>
                خروجی گزارش
            </h2>

            <p>
                مشاهده درآمد،
                تراکنش‌ها و گزارش‌های مالی
            </p>

            <div class="arrow">
                ←
            </div>

        </a>


    </div>


    <!-- فوتر -->

    <div class="footer">

        کافی‌نت جانا
        <span>•</span>
        سیستم مدیریت گزارش

    </div>


</main>


<script>


/* =========================================
   نشانگر موس
========================================= */

const mouseGlow =
    document.getElementById("mouseGlow");

const cursorDot =
    document.getElementById("cursorDot");


let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;


let glowX =
    mouseX;

let glowY =
    mouseY;


document.addEventListener(
    "mousemove",
    function(e){

        mouseX = e.clientX;

        mouseY = e.clientY;


        cursorDot.style.left =
            mouseX + "px";

        cursorDot.style.top =
            mouseY + "px";

    }
);


function animateGlow(){

    glowX +=
        (mouseX - glowX) * .08;

    glowY +=
        (mouseY - glowY) * .08;


    mouseGlow.style.left =
        glowX + "px";

    mouseGlow.style.top =
        glowY + "px";


    requestAnimationFrame(
        animateGlow
    );

}


animateGlow();


/* =========================================
   پشتیبانی لمس موبایل
========================================= */

document.addEventListener(
    "touchmove",
    function(e){

        if(!e.touches.length)
            return;


        const touch =
            e.touches[0];


        mouseX =
            touch.clientX;

        mouseY =
            touch.clientY;


        cursorDot.style.left =
            mouseX + "px";

        cursorDot.style.top =
            mouseY + "px";

    },
    {
        passive:true
    }
);


</script>

</body>

</html>
