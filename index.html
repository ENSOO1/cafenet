<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل کافی نت</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:white;font-family:tahoma}.box{max-width:1000px;margin:auto;padding:20px}.head,.card,.panel{background:#10131a;border:1px solid #252b38;border-radius:18px;padding:20px;margin-bottom:15px}.head{display:flex;justify-content:space-between}.head b{font-size:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{margin:0}.card small{color:#89919f}.card h2{color:#00e5a0}.main{display:grid;grid-template-columns:1fr 1fr;gap:15px}.input,button{width:100%;padding:13px;margin:6px 0;border-radius:11px;border:1px solid #303746;background:#171b24;color:white}button{background:#006cff;border:0;font-weight:bold;cursor:pointer}.item{background:#171b24;padding:12px;border-radius:10px;margin:7px 0}.del{background:#421923;width:auto;padding:7px;float:left}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="box">

<div class="head">
<b>💻 پنل مدیریت کافی‌نت</b>
<span id="date"></span>
</div>

<div class="stats">
<div class="card"><small>💰 امروز</small><h2 id="today">0</h2></div>
<div class="card"><small>📈 ماه</small><h2 id="month">0</h2></div>
<div class="card"><small>🧾 خدمات</small><h2 id="count">0</h2></div>
<div class="card"><small>💵 میانگین</small><h2 id="avg">0</h2></div>
</div>

<div class="main">

<div class="panel">
<h3>➕ ثبت خدمت</h3>

<select id="service" class="input">
<option>پرینت</option>
<option>کپی</option>
<option>ثبت نام اینترنتی</option>
<option>خدمات سامانه</option>
<option>خدمات قضایی</option>
<option>یارانه</option>
<option>نظام وظیفه</option>
<option>اسکن</option>
<option>تایپ</option>
<option>سایر</option>
</select>

<input id="price" class="input" type="number" placeholder="مبلغ تومان">
<input id="name" class="input" placeholder="نام مشتری">

<button onclick="add()">ثبت تراکنش</button>
</div>

<div class="panel">
<h3>🧾 تراکنش‌ها</h3>
<div id="list"></div>
</div>

</div>
</div>

<script>
let data=JSON.parse(localStorage.data||"[]");

date.innerText=new Date().toLocaleDateString("fa-IR");

function money(x){return x.toLocaleString("fa-IR")}

function add(){
let s=service.value,p=+price.value,n=name.value;
if(!p)return alert("مبلغ را وارد کن");
data.unshift({s,p,n,d:new Date()});
localStorage.data=JSON.stringify(data);
price.value=name.value="";
show();
}

function del(i){
data.splice(i,1);
localStorage.data=JSON.stringify(data);
show();
}

function show(){
let now=new Date(),t=0,m=0;
data.forEach(x=>{
let d=new Date(x.d);
if(d.toDateString()==now.toDateString())t+=x.p;
if(d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear())m+=x.p;
});

today.innerText=money(t);
month.innerText=money(m);
count.innerText=money(data.length);
avg.innerText=money(data.length?Math.round(data.reduce((a,x)=>a+x.p,0)/data.length):0);

list.innerHTML=data.map((x,i)=>
<div class="item">
<b>${x.s}</b><br>
${x.n||"بدون نام"}<br>
💰 ${money(x.p)} تومان
<button class="del" onclick="del(${i})">حذف</button>
</div>).join("")||"هنوز تراکنشی ثبت نشده";
}

show();
</script>

</body>
</html>
