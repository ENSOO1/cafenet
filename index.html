<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کافی‌نت جانا</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#030303;
    color:white;
    font-family:Tahoma,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:#00ff66;
    opacity:.08;
    filter:blur(150px);
    border-radius:50%;
    top:-150px;
    right:-100px;
}

body:after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#0088ff;
    opacity:.07;
    filter:blur(150px);
    border-radius:50%;
    bottom:-150px;
    left:-100px;
}

.container{
    width:90%;
    max-width:900px;
    text-align:center;
}

h1{
    font-size:38px;
    margin-bottom:10px;
    text-shadow:0 0 25px rgba(0,255,100,.4);
}

.subtitle{
    color:#777;
    margin-bottom:50px;
}

.cards{
    display:flex;
    gap:30px;
    justify-content:center;
}

.card{
    width:350px;
    height:250px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border-radius:30px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    cursor:pointer;

    transition:all .35s ease;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.card:hover{
    transform:translateY(-12px) scale(1.03);

    border-color:#00ff66;

    box-shadow:
        0 25px 70px rgba(0,0,0,.7),
        0 0 30px rgba(0,255,100,.15);
}

.icon{
    font-size:55px;
    margin-bottom:20px;
}

.card h2{
    margin:0 0 12px;
    font-size:25px;
}

.card p{
    margin:0;
    color:#888;
    font-size:14px;
}

#dashboard{
    display:none;
    width:100%;
    min-height:100vh;
    padding:30px;
}

.back{
    background:rgba(255,255,255,.07);
    color:white;
    border:1px solid rgba(255,255,255,.15);
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
}

@media(max-width:700px){

    body{
        overflow:auto;
        padding:30px 0;
    }

    .cards{
        flex-direction:column;
        align-items:center;
    }

    .card{
        width:100%;
        max-width:350px;
    }

    h1{
        font-size:30px;
    }

}

</style>
</head>

<body>

<div id="home">

    <div class="container">

        <h1>
            کافی‌نت جانـــــــا
        </h1>

        <div class="subtitle">
            سامانه مدیریت گزارش
        </div>

        <div class="cards">

            <div class="card" id="inputBtn">

                <div class="icon">
                    📝
                </div>

                <h2>
                    ورودی گزارش
                </h2>

                <p>
                    ثبت و مدیریت اطلاعات
                </p>

            </div>


            <div class="card" id="outputBtn">

                <div class="icon">
                    📊
                </div>

                <h2>
                    خروجی گزارش
                </h2>

                <p>
                    مشاهده گزارش‌ها
                </p>

            </div>

        </div>

    </div>

</div>


<div id="dashboard">

    <button class="back" id="backBtn">
        ← بازگشت
    </button>

    <div class="container" style="margin:80px auto">

        <h1 id="dashboardTitle">
            گزارش
        </h1>

        <p class="subtitle" id="dashboardText">
            پنل گزارش کافی‌نت جانا
        </p>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

    const home = document.getElementById("home");
    const dashboard = document.getElementById("dashboard");

    const inputBtn = document.getElementById("inputBtn");
    const outputBtn = document.getElementById("outputBtn");

    const backBtn = document.getElementById("backBtn");
const title = document.getElementById("dashboardTitle");
    const text = document.getElementById("dashboardText");


    inputBtn.addEventListener("click", function(){

        home.style.display = "none";

        dashboard.style.display = "block";

        title.innerText = "ورودی گزارش";

        text.innerText =
            "اینجا پنل ثبت و مدیریت گزارش قرار می‌گیرد.";

    });


    outputBtn.addEventListener("click", function(){

        home.style.display = "none";

        dashboard.style.display = "block";

        title.innerText = "خروجی گزارش";

        text.innerText =
            "اینجا گزارش‌های کافی‌نت نمایش داده می‌شود.";

    });


    backBtn.addEventListener("click", function(){

        dashboard.style.display = "none";

        home.style.display = "flex";

    });

});

</script>

</body>
</html>
