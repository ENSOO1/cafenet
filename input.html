<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورودی گزارش | کافی‌نت جانا</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
    background:#020202;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* پس‌زمینه */
body::before{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#00ff88;
    opacity:.08;
    filter:blur(100px);
    top:-120px;
    right:-100px;
}

body::after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#0077ff;
    opacity:.10;
    filter:blur(100px);
    bottom:-120px;
    left:-100px;
}

/* نور موس */
#mouseGlow{
    position:fixed;
    width:260px;
    height:260px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(
        circle,
        rgba(0,255,136,.12),
        transparent 70%
    );
    transform:translate(-50%,-50%);
    z-index:0;
}

/* کارت */
.card{
    position:relative;
    z-index:2;
    width:min(420px,90%);
    padding:40px 30px;

    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.08);

    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.icon{
    width:75px;
    height:75px;
    margin:auto;
    margin-bottom:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:rgba(0,255,136,.08);
    border:1px solid rgba(0,255,136,.2);

    font-size:32px;
}

h1{
    text-align:center;
    font-size:24px;
    margin-bottom:10px;
}

h1 span{
    color:#00ff88;
    text-shadow:0 0 15px rgba(0,255,136,.3);
}

.sub{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-bottom:30px;
}

/* ورودی */
label{
    display:block;
    font-size:13px;
    color:#ccc;
    margin-bottom:9px;
}

.inputBox{
    position:relative;
}

input{
    width:100%;
    height:56px;

    border-radius:16px;
    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.45);

    color:white;

    outline:none;

    padding:0 17px 0 55px;

    font-size:17px;

    transition:.25s;
}

input:focus{
    border-color:#00ff88;
    box-shadow:0 0 20px rgba(0,255,136,.1);
}

/* دکمه چشم */
#eye{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:none;
    background:transparent;

    cursor:pointer;

    color:#888;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
}

#eye:hover{
    color:#00ff88;
}

#eye svg{
    width:24px;
    height:24px;

    stroke:currentColor;
    fill:none;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
}

/* دکمه ورود */
button.login{
    width:100%;
    height:56px;

    margin-top:20px;

    border:none;
    border-radius:16px;

    background:linear-gradient(
        135deg,
        #00ff88,
        #00d878
    );

    color:#001b0d;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 0 25px rgba(0,255,136,.15);
}

button.login:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 35px rgba(0,255,136,.25);
}

button.login:active{
    transform:scale(.97);
}

#error{
    text-align:center;
    color:#ff536b;
    font-size:12px;

    min-height:20px;
    margin-top:12px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#444;
    font-size:9px;
    letter-spacing:1px;
}

/* موبایل */
@media(max-width:600px){

    .card{
        padding:32px 20px;
    }

    h1{
        font-size:21px;
    }
}
</style>
</head>
<body>

<div id="mouseGlow"></div>

<div class="card">

    <div class="icon">
        🔐
    </div>

    <h1>
        ورود به <span>ورودی گزارش</span>
    </h1>

    <div class="sub">
        کافی‌نت جانا • دسترسی مدیریت
    </div>

    <label>رمز عبور</label>

    <div class="inputBox">

        <input
            id="password"
            type="password"
            placeholder="رمز عبور را وارد کنید"
            autocomplete="off"
        >

        <button
            id="eye"
            type="button"
            aria-label="نمایش رمز"
        >

            <!-- چشم خط‌خورده -->
            <svg id="eyeOff"
                 viewBox="0 0 24 24">

                <path d="M2.5 12
                         C4.5 8
                         8 6
                         12 6
                         C16 6
                         19.5 8
                         21.5 12
                         C19.5 16
                         16 18
                         12 18
                         C8 18
                         4.5 16
                         2.5 12Z"/>

                <circle cx="12" cy="12" r="2.5"/>

                <!-- خط روی چشم -->
                <path d="M4 4 L20 20"/>

            </svg>

            <!-- چشم باز -->
            <svg id="eyeOn"
                 viewBox="0 0 24 24"
                 style="display:none">

                <path d="M2.5 12
                         C4.5 8
                         8 6
                         12 6
                         C16 6
                         19.5 8
                         21.5 12
                         C19.5 16
                         16 18
                         12 18
                         C8 18
                         4.5 16
                         2.5 12Z"/>

                <circle cx="12" cy="12" r="2.5"/>

            </svg>

        </button>

    </div>

    <button
        class="login"
        id="loginButton"
        type="button"
    >
        ورود به سامانه
    </button>

    <div id="error"></div>

    <div class="footer">
        JANA CYBER CAFE
    </div>

</div>

<script>

/* ==========================
   چشم
========================== */

const password =
    document.getElementById("password");

const eye =
    document.getElementById("eye");

const eyeOff =
    document.getElementById("eyeOff");

const eyeOn =
    document.getElementById("eyeOn");

eye.onclick = function(){

    if(password.type === "password"){

        password.type = "text";

        eyeOff.style.display = "none";
        eyeOn.style.display = "block";

    }else{

        password.type = "password";

        eyeOff.style.display = "block";
        eyeOn.style.display = "none";

    }

};


/* ==========================
   ورود
========================== */

const loginButton =
    document.getElementById("loginButton");

const error =
    document.getElementById("error");

function login(){

    const pass =
        password.value.trim();

    if(pass === "0000"){

        error.textContent = "";

        /*
          انتقال مستقیم به فایل
        */

        window.location.href =
            "./input-panel.html";

    }else{

        error.textContent =
            "رمز عبور اشتباه است";

        password.value = "";

        password.focus();

    }

}

loginButton.onclick = login;


/* ==========================
   ENTER
========================== */

password.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            login();
        }

    }
);


/* ==========================
   نور دنبال‌کننده موس
========================== */

const mouseGlow =
    document.getElementById("mouseGlow");

document.addEventListener(
    "mousemove",
    function(event){

        mouseGlow.style.left =
            event.clientX + "px";

        mouseGlow.style.top =
            event.clientY + "px";

    }
);

</script>

</body>
</html>
