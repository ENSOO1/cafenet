<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ورودی گزارش | کافی‌نت جانا</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Tahoma,Arial,sans-serif;
color:#fff;

background:
radial-gradient(circle at 20% 20%,rgba(0,255,100,.11),transparent 30%),
radial-gradient(circle at 80% 80%,rgba(0,120,255,.13),transparent 30%),
#020202;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
}

.login{
width:92%;
max-width:430px;
padding:35px;

border-radius:30px;

background:rgba(255,255,255,.055);

border:1px solid rgba(255,255,255,.13);

backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

box-shadow:
0 30px 90px rgba(0,0,0,.7),
0 0 40px rgba(0,255,100,.08);

text-align:center;
}

.logo{
font-size:27px;
margin-bottom:10px;
}

.logo span{
color:#00ff66;
}

.subtitle{
color:#777;
font-size:13px;
margin-bottom:30px;
}

.passwordBox{
position:relative;
}

input{
width:100%;
height:52px;

padding:0 18px 0 52px;

border-radius:14px;

border:1px solid rgba(255,255,255,.12);

background:rgba(0,0,0,.35);

color:#fff;

font-size:17px;

outline:none;

direction:ltr;

text-align:center;
}

input:focus{
border-color:#00ff66;
box-shadow:0 0 20px rgba(0,255,100,.1);
}

.eye{
position:absolute;

left:10px;
top:8px;

width:36px;
height:36px;

border:0;

background:rgba(255,255,255,.06);

color:#aaa;

border-radius:10px;

cursor:pointer;

font-size:18px;
}

.eye:hover{
color:#00ff66;
}

.loginBtn{
width:100%;

margin-top:15px;

height:52px;

border:0;

border-radius:14px;

background:#00ff66;

color:#000;

font-weight:bold;

font-size:16px;

cursor:pointer;

transition:.3s;
}

.loginBtn:hover{
transform:translateY(-3px);

box-shadow:
0 0 30px rgba(0,255,100,.3);
}

.back{
display:block;

margin-top:20px;

color:#777;

text-decoration:none;

font-size:13px;
}

.back:hover{
color:#fff;
}

.error{
height:20px;

margin-top:12px;

color:#ff5555;

font-size:13px;
}

</style>

</head>

<body>

<div class="login">

<div class="logo">
کافی‌نت <span>جانا</span>
</div>

<div class="subtitle">
ورود به بخش ورودی گزارش
</div>

<div class="passwordBox">

<input
id="password"
type="password"
placeholder="رمز ورود"
autocomplete="off"
>

<button
class="eye"
id="eye"
type="button"
onclick="togglePassword()"
>
👁
</button>

</div>

<div
class="error"
id="error"
></div>

<button
class="loginBtn"
onclick="login()"
>
ورود به پنل
</button>

<a
href="index.html"
class="back"
>
← بازگشت
</a>

</div>


<script>

function togglePassword(){

const input =
document.getElementById("password");

const eye =
document.getElementById("eye");

if(input.type === "password"){

input.type = "text";

eye.innerText = "🙈";

}else{

input.type = "password";

eye.innerText = "👁";

}

}


function login(){

const password =
document.getElementById("password").value;

const error =
document.getElementById("error");


if(password === "0000"){

window.location.href = "input-panel.html";

}else{

error.innerText =
"رمز عبور اشتباه است";

}

}


document
.getElementById("password")
.addEventListener("keydown",function(e){

if(e.key === "Enter"){
login();
}

});

</script>

</body>
</html>
